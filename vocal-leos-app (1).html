  Digit words. Bantu languages put the UNIT first, then the count with noun-class agreement:
  Kinyarwanda: "ibihumbi bitatu" = thousands + three = 3000

  English/French put the count first: "three thousand"

 sixty:60,soixante:60,sitini:60,
 seventy:70,sabini:70,
 eighty:80,themanini:80,
 ninety:90,tisini:90

const SCALE={
 hundred:100,cent:100,cents:100,
 mia:100,ijana:100,amagana:100,magana:100,gana:100,
 thousand:1000,mille:1000,
 elfu:1000,igihumbi:1000,ibihumbi:1000,bihumbi:1000,humbi:1000,gihumbi:1000,
 million:1e6,milioni:1e6,miliyoni:1e6,miliyoni:1e6
};
const CONN=new Set(["and","et","na","n","ya","za","n'","n\u2019"]);

function wordsToNumber(str){
 const toks=String(str).toLowerCase()
  .replace(/[’']/g," ")
  .replace(/-/g," ")
  .split(/\s+/)
  .filter(t=>t&&!CONN.has(t));
 if(!toks.length)return null;

 /* Pattern A — Bantu unit-first: "ibihumbi bitatu", "elfu tatu", "amagana atanu", "mia tano" */
 let total=0,i=0,matched=false;
 while(i<toks.length){
  const a=toks[i],b=toks[i+1];
  const scaleA=SCALE[a],digitB=b!=null?DIGIT[b]:null;
  if(scaleA!=null&&digitB!=null){
   total+=scaleA*digitB;matched=true;i+=2;continue;
  }
  /* Pattern B — count-first (EN/FR): "three thousand", "cinq cents" */
  const digitA=DIGIT[a],scaleB=b!=null?SCALE[b]:null;
  if(digitA!=null&&scaleB!=null){
   total+=digitA*scaleB;matched=true;i+=2;continue;
  }
  /* Bare scale = 1×scale ("igihumbi" alone = 1000) */
  if(scaleA!=null){total+=scaleA;matched=true;i++;continue}
  /* Bare digit */
  if(digitA!=null){total+=digitA;matched=true;i++;continue}
  /* EN-style running total: "fifty" then "thousand" handled above; leftover "hundred" after digit */
  if(matched)break;
  i++;
 }
 return matched&&total>0?total:null;
}

function normalizeAmounts(text){
 let s=String(text);
 /* 50,000 / 50 000 / 50.000 → 50000 */
 s=s.replace(/(\d{1,3})(?:[ ,\u00a0\u202f.](?=\d{3}))+/g,(m)=>m.replace(/[ ,\u00a0\u202f.]/g,""));
 s=s.replace(/(\d)\s*[kK]\b/g,"$1000");
 /* Replace longest spoken number phrases with digits */
 const re=/\b(?:ibihumbi|igihumbi|bihumbi|humbi|gihumbi|amagana|ijana|magana|elfu|mia|milioni|miliyoni|thousand|hundred|million|mille|cent|cents|[a-zà-ÿ]+)(?:\s+(?:na|n'|n’|and|et|ya|za|[a-zà-ÿ]+)){0,6}\b/gi;
 s=s.replace(re,(phrase)=>{
  const n=wordsToNumber(phrase);
  return n!=null?String(n):phrase;
 });
 return s;
}

$("tour").onclose=()=>{if(ME)ST("vl_tour_"+ME,1)};$("bHelp").onclick=openTour;
/* ---------- language menu and packs ---------- */
function closeM(){$("lm").hidden=true;$("lang").setAttribute("aria-expanded","false")}
function menu(){const u=$("lm");u.replaceChildren();Object.keys(PK).forEach(c=>{const li=mk("li"),b=mk("button");b.setAttribute("role","option");b.setAttribute("aria-selected",c==LANG);b.append(flag(c),document.createTextNode(PK[c].name));b.onclick=()=>{closeM();setLang(c)};li.append(b);u.append(li)});
 const li=mk("li"),a=mk("button","add","＋ "+t("pkNew"));a.onclick=()=>{closeM();$("pj").value=JSON.stringify({code:"pt",name:"Português",speech:"pt-BR",ui:{signin:"Entrar",signup:"Criar conta",h1:"Diga seus registros. O VOCAL-LEOs mantém os livros."},kw:{in:"depositei,recebi",out:"retirei,paguei",owedme:"me deve",iowe:"eu devo"},ex:["Depositei 50000 de Jane","Jane me deve 10000"]},null,1);$("pe").textContent="";$("pack").showModal()};li.append(a);u.append(li)}
$("lang").onclick=()=>{const o=$("lm").hidden;$("lm").hidden=!o;$("lang").setAttribute("aria-expanded",o)};
document.addEventListener("click",e=>{if(!e.target.closest(".lw"))closeM()});document.addEventListener("keydown",e=>{if(e.key=="Escape")closeM()});
$("pc").onclick=()=>$("pack").close();
$("pf").onsubmit=e=>{e.preventDefault();try{const p=JSON.parse($("pj").value);if(!/^[a-z]{2,8}(-[A-Za-z]+)?$/.test(p.code)||PK[p.code]||!p.name||typeof p.ui!="object")throw 0;
 const c={code:p.code,name:String(p.name).slice(0,30),sp:String(p.speech||p.code),ui:{},kw:{}};if(Array.isArray(p.ex)&&p.ex.length)c.ex=p.ex.map(String).slice(0,5);
 for(const k in p.ui)if(typeof p.ui[k]=="string")c.ui[k]=p.ui[k].slice(0,500);for(const k in(p.kw||{}))if(typeof p.kw[k]=="string")c.kw[k]=p.kw[k].slice(0,600);
 const L=(LS("vl_packs")||[]).filter(x=>x.code!=c.code);L.push(c);ST("vl_packs",L);PK[c.code]=c;build();$("pack").close();setLang(c.code);toast(t("pkOk"))}catch(x){$("pe").textContent=t("pkErr")}};
function setLang(c){LANG=c;ST("vl_lang",c);applyLang()}
function applyLang(){document.documentElement.lang=LANG;
 document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
 $("dTxt").placeholder=ex()[0];$("aTxt").placeholder=ex()[1];$("theme").title=$("theme").ariaLabel=t("thm");
 const lg=$("lang");lg.replaceChildren(flag(LANG),document.createTextNode(LANG.toUpperCase()));menu();
 exChips($("dChips"),x=>{$("dTxt").value=x;go()});exChips($("aChips"),x=>{$("aTxt").value=x;goA()});
 const h=$("hLangs");h.replaceChildren();Object.keys(PK).forEach(c=>{const b=mk("button","chip");b.append(flag(c),document.createTextNode(PK[c].name));b.onclick=()=>setLang(c);h.append(b)});
 if($("auth").open)mode(SIGNUP);setHi();drawDemo();if(ME)draw();if($("tour").open)tour(TI)}
/* ---------- theme + start ---------- */
const TM=["system","light","dark"];let tm=LS("vl_theme");if(!TM.includes(tm))tm="system";
function applyTheme(){const d=document.documentElement;if(tm=="system")d.removeAttribute("data-theme");else d.dataset.theme=tm}
$("theme").onclick=()=>{tm=TM[(TM.indexOf(tm)+1)%3];ST("vl_theme",tm);applyTheme();toast(t("thm")+": "+tm)};applyTheme();
applyLang();
const sess=LS("vl_session");if(sess&&(sess=="guest"||(LS("vl_users")||{})[sess]))enter(sess);
</script>
</body>
</html>
